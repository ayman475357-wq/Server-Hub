name: Build Server Hub APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p ServerHub-Android-Clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: server-hub-apk
          path: ServerHub-Android-Clean/app/build/outputs/apk/**/*.apk
